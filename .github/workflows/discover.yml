name: discover fresh finds

on:
  schedule:
    # 06:15 UTC every Monday, matching the guide's own Monday research slot
    - cron: "15 6 * * 1"
  workflow_dispatch:

concurrency:
  group: discover
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: look for new findings
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
        run: npm run discover

      - name: check the site still builds
        run: npm run build

      - name: commit anything new
        run: |
          if git diff --quiet -- content/finds.json; then
            echo "no new findings"
            exit 0
          fi
          git config user.name "fresh finds bot"
          git config user.email "actions@github.com"
          git add content/finds.json
          git commit -m "new findings for $(date -u +%Y-%m-%d)"
          git push
